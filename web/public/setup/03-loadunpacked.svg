<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-label="El botón Cargar descomprimida aparece arriba a la izquierda">
  <style>
    .t { font-family: 'Segoe UI', system-ui, sans-serif; }
  </style>
  <rect width="640" height="260" fill="#1b1d21"/>

  <rect x="0" y="0" width="640" height="56" fill="#202124"/>
  <text class="t" x="16" y="22" font-size="10" fill="#5f6368">chrome://extensions</text>
  <!-- barra azul de developer mode -->
  <rect x="0" y="30" width="640" height="26" fill="#1a3a5c"/>
  <text class="t" x="16" y="47" font-size="10" fill="#8ab4f8">Modo de desarrollador</text>

  <!-- CARGAR DESCOMPRIMIDA: ARRIBA A LA IZQUIERDA -->
  <rect x="16" y="66" width="186" height="32" rx="6" fill="#8ab4f8"/>
  <text class="t" x="30" y="87" font-size="13" font-weight="600" fill="#06243f">Cargar descomprimida</text>

  <path d="M210 128 C250 128 250 84 240 84" fill="none" stroke="#00d18f" stroke-width="2.5" stroke-dasharray="5 4"/>
  <path d="M240 84 l-2 10 l9 -5 z" fill="#00d18f"/>
  <text class="t" x="264" y="132" font-size="13" fill="#00d18f">3) este botón</text>

  <text class="t" x="16" y="186" font-size="12" fill="#9aa0a6">Aparece arriba a la izquierda, en la barra azul.</text>
  <text class="t" x="16" y="210" font-size="12" fill="#9aa0a6">Al pulsarlo se abre una ventana para elegir la carpeta de la extensión.</text>
  <text class="t" x="16" y="240" font-size="11" fill="#5f6368">"Load unpacked" si tu navegador está en inglés.</text>
</svg>
